name: Galley
options:
  bundleIdPrefix: com.robertritz
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  GalleyCore:
    path: GalleyCore
settings:
  base:
    MARKETING_VERSION: 0.2.1
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: 6.0
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: J5NT99LSV6
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # The app ID. Test builds override it (GALLEY_BUNDLE_ID=com.robertritz.galley.dev)
    # so they can run next to the real app; the extension's ID follows it.
    GALLEY_BUNDLE_ID: com.robertritz.galley
    GALLEY_URL_SCHEME: galley
targets:
  Galley:
    type: application
    platform: macOS
    sources:
      - path: Galley
    dependencies:
      - package: GalleyCore
        product: GalleyCore
      - target: GalleyShare
    info:
      path: Galley/Info.plist
      properties:
        CFBundleDisplayName: Galley
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.news
        NSHumanReadableCopyright: Galley is open source under the MIT licence.
        GalleyURLScheme: $(GALLEY_URL_SCHEME)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(GALLEY_URL_SCHEME)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GALLEY_BUNDLE_ID)
        PRODUCT_NAME: Galley
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  GalleyShare:
    type: app-extension
    platform: macOS
    sources:
      - path: GalleyShare
    entitlements:
      path: GalleyShare/GalleyShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: GalleyShare/Info.plist
      properties:
        CFBundleDisplayName: Galley
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GalleyURLScheme: $(GALLEY_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GALLEY_BUNDLE_ID).share
        PRODUCT_NAME: GalleyShare
        SKIP_INSTALL: YES
