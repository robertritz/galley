name: Galley
options:
  bundleIdPrefix: com.robertritz
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  GalleyCore:
    path: GalleyCore
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Galley:
    type: application
    platform: macOS
    sources:
      - path: Galley
    dependencies:
      - package: GalleyCore
        product: GalleyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertritz.galley
        PRODUCT_NAME: Galley
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Galley
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_NSHumanReadableCopyright: "Galley is open source under the MIT licence."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
